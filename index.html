<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A browser-based fractal terrain generator: simplex noise, elevation palettes and an orbitable 3D view. Single file, no build step.">
<title>Fractal Cartographer</title>
<style>
  :root{ color-scheme: light dark; }
  html,body{ margin:0; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
:root{
  --ground:#E6EBE9;
  --panel:#FAFBFA;
  --panel-2:#F0F4F2;
  --edge:#C8D3CF;
  --edge-soft:#DDE5E2;
  --ink:#0E1C19;
  --muted:#5A706C;
  --accent:#0E6E62;
  --accent-ink:#0A4B43;
  --accent-soft:#D8E8E3;
  --on-accent:#F7FBFA;
  --shadow:0 1px 2px rgba(14,28,25,.06), 0 8px 24px rgba(14,28,25,.06);
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#08110F;
    --panel:#0E1A18;
    --panel-2:#132220;
    --edge:#1E302C;
    --edge-soft:#172624;
    --ink:#E6EEEB;
    --muted:#8AA29D;
    --accent:#3FBFA8;
    --accent-ink:#7FD9C8;
    --accent-soft:#11322C;
    --on-accent:#04201C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#08110F;
  --panel:#0E1A18;
  --panel-2:#132220;
  --edge:#1E302C;
  --edge-soft:#172624;
  --ink:#E6EEEB;
  --muted:#8AA29D;
  --accent:#3FBFA8;
  --accent-ink:#7FD9C8;
  --accent-soft:#11322C;
  --on-accent:#04201C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.app{
  display:grid; grid-template-columns:336px minmax(0,1fr);
  gap:16px; height:100dvh; padding:16px;
}

/* ── rail ─────────────────────────────────────────────── */
.rail{
  background:var(--panel); border:1px solid var(--edge); border-radius:10px;
  overflow-y:auto; overflow-x:hidden; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.masthead{ padding:20px 20px 16px; border-bottom:1px solid var(--edge); }
.mast-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.masthead h1{
  font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.02;
  margin:0 0 6px; letter-spacing:-.01em; text-wrap:balance;
}
.masthead p{ margin:0; color:var(--muted); font-size:12.5px; max-width:34ch; }

.lang{
  display:flex; border:1px solid var(--edge); border-radius:6px; overflow:hidden;
  flex:0 0 auto; margin-top:4px;
}
.lang button{
  border:0; border-radius:0; padding:4px 8px; font-size:10.5px; font-weight:600;
  letter-spacing:.08em; background:var(--panel-2); color:var(--muted); cursor:pointer;
}
.lang button + button{ border-left:1px solid var(--edge); }
.lang button:hover{ color:var(--accent); }
.lang button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }

.rail-body{ padding:4px 20px 20px; display:flex; flex-direction:column; gap:2px; }

.group{ padding-top:18px; }
.group + .group{ margin-top:4px; }
.group-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.group-head h2{
  font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  margin:0; color:var(--accent);
}
.group-head .rule{ flex:1; height:1px; background:var(--edge); }
.group-head .rule::after{
  content:""; display:block; height:1px; background:var(--edge-soft); margin-top:2px;
}

.ctl{ display:flex; flex-direction:column; gap:5px; padding:7px 0; }
.ctl-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.ctl label{ font-size:12.5px; font-weight:500; color:var(--ink); }
.ctl .val{
  font-family:var(--mono); font-size:11.5px; font-variant-numeric:tabular-nums;
  color:var(--muted); white-space:nowrap;
}
.ctl .hint{ font-size:11px; color:var(--muted); margin-top:-1px; }

input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:18px;
  background:transparent; cursor:grab; margin:0;
}
input[type=range]:active{ cursor:grabbing; }
input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:2px; background:var(--edge); }
input[type=range]::-moz-range-track{ height:3px; border-radius:2px; background:var(--edge); }
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:14px; height:14px; margin-top:-5.5px;
  border-radius:50%; background:var(--panel); border:2px solid var(--accent);
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--panel);
  border:2px solid var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.2);
}
input[type=range]:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:4px; }

select, input[type=number]{
  width:100%; font-family:var(--sans); font-size:12.5px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--edge); border-radius:6px;
  padding:7px 9px; appearance:none;
}
select{
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:30px;
}
select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

.check{ display:flex; align-items:center; gap:9px; padding:7px 0; cursor:pointer; }
.check input{ accent-color:var(--accent); width:15px; height:15px; margin:0; cursor:pointer; }
.check span{ font-size:12.5px; font-weight:500; }

.seed-row{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
button{
  font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--edge); border-radius:6px;
  padding:8px 12px; cursor:pointer; white-space:nowrap;
}
button:hover{ border-color:var(--accent); color:var(--accent); }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
button.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
button.primary:hover{ filter:brightness(1.08); }
.btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
button:disabled{ opacity:.55; cursor:default; }
button:disabled:hover{ border-color:var(--edge); color:var(--ink); filter:none; }
.progress{
  height:3px; border-radius:2px; background:var(--edge); overflow:hidden; margin-top:10px;
}
.progress-fill{ height:100%; width:0%; background:var(--accent); }

.colophon{
  margin-top:auto; padding:16px 20px; border-top:1px solid var(--edge);
  font-size:11px; color:var(--muted); line-height:1.5;
}
.colophon b{ font-weight:600; color:var(--ink); }

/* ── stage ────────────────────────────────────────────── */
.stage{
  position:relative; border-radius:10px; overflow:hidden; min-height:0;
  border:1px solid var(--edge); box-shadow:var(--shadow);
  background:linear-gradient(#a9c7dd 0%, #d5e4ec 52%, #eaeee9 100%);
}
#viewport{ position:absolute; inset:0; }
#viewport canvas{ display:block; touch-action:none; }

.hud{ position:absolute; pointer-events:none; }
.chips{ top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  background:rgba(255,255,255,.82); border:1px solid rgba(14,28,25,.12);
  border-radius:6px; padding:5px 9px; backdrop-filter:blur(6px);
  display:flex; align-items:baseline; gap:7px;
}
.chip .k{
  font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#4a5f5b;
}
.chip .v{
  font-family:var(--mono); font-size:12px; font-weight:500;
  font-variant-numeric:tabular-nums; color:#0E1C19;
}
.hint-bar{
  bottom:12px; left:12px; font-size:11px; color:#2c3c39;
  background:rgba(255,255,255,.72); border:1px solid rgba(14,28,25,.10);
  border-radius:6px; padding:5px 9px; backdrop-filter:blur(6px);
}
.legend{
  bottom:12px; right:12px; display:flex; gap:8px; align-items:stretch;
  background:rgba(255,255,255,.82); border:1px solid rgba(14,28,25,.12);
  border-radius:6px; padding:9px 10px; backdrop-filter:blur(6px);
}
.legend .bar{ width:11px; border-radius:2px; border:1px solid rgba(14,28,25,.18); }
.legend .ticks{
  display:flex; flex-direction:column; justify-content:space-between;
  font-family:var(--mono); font-size:10px; font-variant-numeric:tabular-nums;
  color:#2c3c39; height:104px;
}
.legend .cap{
  writing-mode:vertical-rl; font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  font-weight:600; color:#4a5f5b; margin-left:2px;
}
.fallback{
  position:absolute; inset:0; display:none; place-content:center; text-align:center;
  padding:32px; background:var(--panel); color:var(--ink); font-size:13px;
}

@media (max-width:900px){
  /* stacked layout: the terrain leads, the controls follow */
  .app{ grid-template-columns:1fr; height:auto; padding:16px; gap:14px; }
  .stage{ order:1; height:56vh; min-height:340px; }
  .rail{ order:2; overflow:visible; }
  .legend .ticks{ height:84px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="masthead">
      <div class="mast-top">
        <h1 data-i18n="title">Fractal Cartographer</h1>
        <div class="lang" id="lang" role="group" aria-label="Language / Lingua">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="it" aria-pressed="false">IT</button>
        </div>
      </div>
      <p data-i18n="tagline"></p>
    </div>
    <div class="rail-body" id="rail-body"></div>
    <div class="colophon" data-i18n-html="colophon"></div>
  </aside>

  <main class="stage" id="stage">
    <div id="viewport"></div>
    <div class="hud chips" id="chips"></div>
    <div class="hud hint-bar" data-i18n="hintBar"></div>
    <div class="hud legend" id="legend" hidden>
      <div class="bar" id="legend-bar"></div>
      <div class="ticks" id="legend-ticks"></div>
      <div class="cap" data-i18n="legendCap"></div>
    </div>
    <div class="fallback" id="fallback" data-i18n="fallback"></div>
  </main>
</div>

      ramp(strataStops, t, tmp);
      var band = 0.84 + 0.16 * (0.5 + 0.5 * Math.sin(y * 2.35));
      sc[w * 3] = tmp[0] * band; sc[w * 3 + 1] = tmp[1] * band; sc[w * 3 + 2] = tmp[2] * band;
      w++;
    }
    function quad(x1, y1, z1, x2, y2, z2) {
      put(x1, y1, z1); put(x2, y2, z2); put(x1, baseY, z1);
      put(x2, y2, z2); put(x2, baseY, z2); put(x1, baseY, z1);
    }
    function vy(i, j) { return pos[(j * N + i) * 3 + 1]; }
    function vx(i) { return (i / (N - 1) - 0.5) * SIZE; }

    for (var i = 0; i < N - 1; i++) {
      quad(vx(i), vy(i, 0), vx(0), vx(i + 1), vy(i + 1, 0), vx(0));
      quad(vx(i), vy(i, N - 1), vx(N - 1), vx(i + 1), vy(i + 1, N - 1), vx(N - 1));
      quad(vx(0), vy(0, i), vx(i), vx(0), vy(0, i + 1), vx(i + 1));
      quad(vx(N - 1), vy(N - 1, i), vx(i), vx(N - 1), vy(N - 1, i + 1), vx(i + 1));
    }
    var e = SIZE / 2;
    put(-e, baseY, -e); put(e, baseY, -e); put(-e, baseY, e);
    put(e, baseY, -e); put(e, baseY, e); put(-e, baseY, e);

    skirtGeo.attributes.position.needsUpdate = true;
    skirtGeo.attributes.color.needsUpdate = true;
    skirtGeo.computeVertexNormals();
    skirtGeo.attributes.normal.needsUpdate = true;
    skirtGeo.computeBoundingSphere();
  }

  /* ── on-screen readouts ─────────────────────────────── */
  function updateReadouts() {
    var peak = Math.round((1 - state.sea) * state.altitude);
    var deep = Math.round(-state.sea * state.altitude);
    var chips = [
      [L.chips.peak, nf.format(peak) + " m"],
      [L.chips.land, (field.emerged * 100).toFixed(1) + " %"],
      [L.chips.seabed, nf.format(deep) + " m"],
      [L.chips.vertices, nf.format(field.n * field.n)],
      [L.chips.seed, String(state.seed)]
    ];
    if (field.eroded > 0) chips.splice(4, 0, [L.chips.eroded, nf.format(field.eroded)]);
    document.getElementById("chips").innerHTML = chips.map(function (c) {
      return '<div class="chip"><span class="k">' + c[0] + '</span><span class="v">' + c[1] + "</span></div>";
    }).join("");

    var pal = PALETTES[state.palette];
    var snowLine = Math.max(0.05, Math.min(0.98, state.snow));
    var stops = [];
    for (var s = 0; s <= 20; s++) {
      var t = s / 20;
      var tc = t < snowLine
        ? t * (pal.snowStart / snowLine)
        : pal.snowStart + (t - snowLine) * (1 - pal.snowStart) / Math.max(1e-6, 1 - snowLine);
      stops.push(sampleHex(pal.land, clamp01(tc)) + " " + (t * 100).toFixed(0) + "%");
    }
    document.getElementById("legend-bar").style.background =
      "linear-gradient(to top, " + stops.join(", ") + ")";
    document.getElementById("legend-ticks").innerHTML =
      [1, 0.5, 0].map(function (f) {
        return "<span>" + nf.format(Math.round(peak * f)) + "</span>";
      }).join("");
    document.getElementById("legend").hidden = false;
  }

  function sampleHex(list, t) {
    var a = list[0], b = list[list.length - 1];
    for (var i = 1; i < list.length; i++) {
      if (t <= list[i][0]) { a = list[i - 1]; b = list[i]; break; }
    }
    var k = clamp01((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
    var ca = parseInt(a[1].slice(1), 16), cb = parseInt(b[1].slice(1), 16);
    var r = Math.round(((ca >> 16) & 255) + (((cb >> 16) & 255) - ((ca >> 16) & 255)) * k);
    var g = Math.round(((ca >> 8) & 255) + (((cb >> 8) & 255) - ((ca >> 8) & 255)) * k);
    var bl = Math.round((ca & 255) + ((cb & 255) - (ca & 255)) * k);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  /* ── parameter panel ────────────────────────────────── */
  // parameters that force a noise resample; the rest only touch colours
  var FIELD_KEYS = ["seed", "noiseType", "scale", "octaves", "persistence",
                    "lacunarity", "warp", "erosion", "island", "res"];

  var GROUPS = [
    { title: "shape", items: [
      { k: "noiseType", type: "select", values: ["fbm", "ridged", "billow"] },
      { k: "scale", type: "range", min: 1, max: 8, step: 0.1, fmt: function (v) { return v.toFixed(1) + "×"; } },
      { k: "octaves", type: "range", min: 1, max: 9, step: 1, fmt: function (v) { return v.toFixed(0); } },
      { k: "persistence", type: "range", min: 0.2, max: 0.75, step: 0.01, fmt: function (v) { return v.toFixed(2); } },
      { k: "lacunarity", type: "range", min: 1.4, max: 3.2, step: 0.05, fmt: function (v) { return v.toFixed(2); } },
      { k: "warp", type: "range", min: 0, max: 1.2, step: 0.01, fmt: function (v) { return v.toFixed(2); } },
      { k: "erosion", type: "range", min: 0.6, max: 3, step: 0.05, fmt: function (v) { return v.toFixed(2); } },
      { k: "island", type: "range", min: 0, max: 1, step: 0.01, fmt: function (v) { return Math.round(v * 100) + " %"; } }
    ] },
    { title: "water", items: [
      { k: "altitude", type: "range", min: 400, max: 5000, step: 50, fmt: function (v) { return nf.format(v) + " m"; } },
      { k: "sea", type: "range", min: 0, max: 0.75, step: 0.005, fmt: function (v) { return Math.round(v * 100) + " %"; } },
      { k: "snow", type: "range", min: 0.3, max: 1, step: 0.01, fmt: function (v) { return Math.round(v * 100) + " %"; } }
    ] },
    { title: "erosion", items: [
      { k: "droplets", type: "range", min: 10000, max: 200000, step: 10000, fmt: function (v) { return nf.format(v); } },
      { k: "erodeRate", type: "range", min: 0.05, max: 0.8, step: 0.01, fmt: function (v) { return v.toFixed(2); } },
      { k: "depositRate", type: "range", min: 0.05, max: 0.8, step: 0.01, fmt: function (v) { return v.toFixed(2); } },
      { k: "inertia", type: "range", min: 0, max: 0.6, step: 0.01, fmt: function (v) { return v.toFixed(2); } }
    ], custom: erosionControls },
    { title: "render", items: [
      { k: "palette", type: "select", values: Object.keys(PALETTES), labels: "palettes" },
      { k: "res", type: "select", values: ["96", "128", "160", "200", "256"], parse: Number },
      { k: "contours", type: "check" },
      { k: "spin", type: "check" }
    ] }
  ];

  function erosionControls() {
    return '<div class="btn-row"><button type="button" class="primary" id="btn-erode">' + L.erode + "</button>" +
      '<button type="button" id="btn-restore">' + L.restore + "</button></div>" +
      '<div class="progress" id="erode-progress" hidden><div class="progress-fill" id="erode-fill"></div></div>' +
      '<div class="hint" style="margin-top:10px">' + L.erodeHint + "</div>";
  }

  function optionLabel(it, value, index) {
    if (it.labels) return L[it.labels][value];
    return L.ctl[it.k].options[index];
  }

  function buildPanel() {
    var root = document.getElementById("rail-body");
    var html = "";
    GROUPS.forEach(function (g) {
      html += '<section class="group"><div class="group-head"><h2>' + L.groups[g.title] +
        '</h2><div class="rule"></div></div>';
      g.items.forEach(function (it) {
        var id = "c-" + it.k, s = L.ctl[it.k];
        if (it.type === "range") {
          html += '<div class="ctl"><div class="ctl-top"><label for="' + id + '">' + s.label + '</label>' +
            '<span class="val" id="v-' + it.k + '">' + it.fmt(state[it.k]) + "</span></div>" +
            '<input type="range" id="' + id + '" min="' + it.min + '" max="' + it.max +
            '" step="' + it.step + '" value="' + state[it.k] + '">' +
            (s.hint ? '<div class="hint">' + s.hint + "</div>" : "") + "</div>";
        } else if (it.type === "select") {
          html += '<div class="ctl"><div class="ctl-top"><label for="' + id + '">' + s.label + "</label></div>" +
            '<select id="' + id + '">' + it.values.map(function (val, n) {
              return '<option value="' + val + '"' + (String(state[it.k]) === val ? " selected" : "") +
                ">" + optionLabel(it, val, n) + "</option>";
            }).join("") + "</select>" + (s.hint ? '<div class="hint">' + s.hint + "</div>" : "") + "</div>";
        } else if (it.type === "check") {
          html += '<label class="check" for="' + id + '"><input type="checkbox" id="' + id + '"' +
            (state[it.k] ? " checked" : "") + '><span>' + s.label + "</span></label>";
        }
      });
      if (g.custom) html += g.custom();
      html += "</section>";
    });

    html += '<section class="group"><div class="group-head"><h2>' + L.groups.seed +
      '</h2><div class="rule"></div></div>' +
      '<div class="ctl"><div class="seed-row">' +
      '<input type="number" id="c-seed" value="' + state.seed + '" min="0" max="999999" step="1" aria-label="' +
      L.seedAria + '">' +
      '<button type="button" id="btn-dice">' + L.roll + "</button></div>" +
      '<div class="hint">' + L.seedHint + "</div></div>" +
      '<div class="btn-row"><button type="button" class="primary" id="btn-new">' + L.newWorld + "</button>" +
      '<button type="button" id="btn-reset">' + L.reset + "</button></div></section>";

    root.innerHTML = html;

    GROUPS.forEach(function (g) {
      g.items.forEach(function (it) {
        var el = document.getElementById("c-" + it.k);
        el.addEventListener("input", function () {
          if (it.type === "check") state[it.k] = el.checked;
          else if (it.type === "select") state[it.k] = it.parse ? it.parse(el.value) : el.value;
          else {
            state[it.k] = parseFloat(el.value);
            document.getElementById("v-" + it.k).textContent = it.fmt(state[it.k]);
          }
          schedule(FIELD_KEYS.indexOf(it.k) !== -1);
        });
      });
    });

    document.getElementById("c-seed").addEventListener("input", function () {
      var v = parseInt(this.value, 10);
      if (!isNaN(v)) { state.seed = v; schedule(true); }
    });
    document.getElementById("btn-erode").addEventListener("click", runErosion);
    document.getElementById("btn-restore").addEventListener("click", restoreTerrain);
    document.getElementById("btn-dice").addEventListener("click", newSeed);
    document.getElementById("btn-new").addEventListener("click", newSeed);
    document.getElementById("btn-reset").addEventListener("click", function () {
      var seed = state.seed;
      Object.keys(DEFAULTS).forEach(function (k) { state[k] = DEFAULTS[k]; });
      state.seed = seed;
      syncPanel();
      schedule(true);
    });
  }

  function newSeed() {
    state.seed = Math.floor(Math.random() * 100000);
    document.getElementById("c-seed").value = state.seed;
    schedule(true);
  }

  function syncPanel() {
    GROUPS.forEach(function (g) {
      g.items.forEach(function (it) {
        var el = document.getElementById("c-" + it.k);
        if (it.type === "check") el.checked = state[it.k];
        else if (it.type === "select") el.value = String(state[it.k]);
        else {
          el.value = state[it.k];
          document.getElementById("v-" + it.k).textContent = it.fmt(state[it.k]);
        }
      });
    });
    document.getElementById("c-seed").value = state.seed;
  }

  /* ── language ───────────────────────────────────────── */
  function applyLang(next) {
    lang = next;
    L = I18N[lang];
    nf = new Intl.NumberFormat(L.locale);
    document.documentElement.lang = lang;
    try { localStorage.setItem("fc-lang", lang); } catch (e) {}

    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = L[el.getAttribute("data-i18n")];
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-html]"), function (el) {
      el.innerHTML = L[el.getAttribute("data-i18n-html")];
    });
    Array.prototype.forEach.call(document.querySelectorAll("#lang button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    document.title = L.title;

    buildPanel();
    if (field.h) updateReadouts();
  }

  document.getElementById("lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b && b.getAttribute("data-lang") !== lang) applyLang(b.getAttribute("data-lang"));
  });

  /* ── frame loop ─────────────────────────────────────── */
  var refieldNeeded = true;
  function schedule(refield) {
    if (refield) refieldNeeded = true;
    needsBuild = true;
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (needsBuild) {
      needsBuild = false;
      if (refieldNeeded) { computeField(); refieldNeeded = false; }
      buildMesh();
    }
    if (state.spin && !drag) cam.theta += dt * 0.075;
    var sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
    camera.position.set(
      cam.r * sp * Math.sin(cam.theta),
      cam.r * cp,
      cam.r * sp * Math.cos(cam.theta)
    );
    camera.lookAt(0, cam.target, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  /* ── boot ───────────────────────────────────────────── */
  applyLang(lang);
  if (!window.THREE) {
    document.getElementById("fallback").style.display = "grid";
  } else {
    initThree();
    resize();
    computeField();
    buildMesh();
    refieldNeeded = false;
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
